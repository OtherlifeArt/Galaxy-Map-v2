# version: '3.9' Obsolete

networks:
  frontend:
    name: ${APP_NAME}-frontend
  tools:
    name: ${APP_NAME}-tools

services:
  web-dev:
    image: ${DEV_IMAGE_NAME}
    container_name: ${APP_NAME}-web-dev
    restart: ${RESTART_POLICY}
    ports:
      - '${HOST_PORT}:80'
    volumes:
      - ./:/usr/local/apache2/htdocs
    networks:
      - frontend
  
  # This service will NOT run automatically : run with "docker compose up; docker compose run --rm optimizer"
  web-prod-builder:
    image: swgalaxymap-prod:latest
    container_name: ${APP_NAME}-web-prod
    restart: ${RESTART_POLICY}
    build:
      context: .
      dockerfile: Dockerfile.prod
    profiles:
      - manual
    volumes:
      - ./dist:/dist
    networks:
      - tools